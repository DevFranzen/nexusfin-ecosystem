services:
  # --- DATABASE: POSTGRES & EXPORTER ---
  postgres:
    container_name: postgres-db
    build: ./services/postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"      
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-256M}

  postgres-exporter:
    container_name: pg-metric-exporter
    build: ./services/postgres-exporter
    env_file: .env
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # --- VECTOR DATABASE: QDRANT ---
  qdrant:
    container_name: qdrant-vector-db
    build: ./services/qdrant
    env_file: .env
    ports:
      - "6333:6333"
      - "6334:6334"
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEMORY_LIMIT:-512M}

  # --- MONITORING: PROMETHEUS ---
  prometheus:
    container_name: prometheus
    build: ./services/prometheus
    env_file: .env
    ports:
      - "9090:9090"
    depends_on:
      - qdrant
      - postgres-exporter
      - redpanda
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-256M}

  # --- VISUALIZATION: GRAFANA ---
  grafana:
    container_name: grafana
    build: ./services/grafana
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-256M}

  loki:
    container_name: loki
    build: ./services/loki
    env_file: .env
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEMORY_LIMIT:-256M}

  # Log collector for Docker container logs
  promtail:
    container_name: promtail
    build: ./services/promtail
    env_file: .env
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  keycloak:
    container_name: keycloak
    build: ./services/keycloak
    env_file: .env
    environment:
      - KC_DB=${KC_DB:-postgres}
      - KC_DB_URL=${KC_DB_URL}
      - KC_DB_USERNAME=${KC_DB_USERNAME}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${KEYCLOAK_MEMORY_LIMIT:-750M}

# --- MESSAGING: REDPANDA (KAFKA API) ---
include:
  - services/redpanda/docker-compose.yml
  - services/ollama/docker-compose.yml