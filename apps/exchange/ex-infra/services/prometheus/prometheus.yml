global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644'] # Standard Admin/Metrics Port

  - job_name: 'keycloak'
    metrics_path: '/health/metrics' # Keycloak (Quarkus) Pfad für Metriken
    static_configs:
      - targets: ['keycloak:8080']